<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Puvi Law Office</title><style>body{margin:0;background:#f5f2ec;color:#233142;font:15px Arial}.top{background:#0b1726;color:white;padding:18px 30px;display:flex;justify-content:space-between}.brand{font:bold 25px Georgia}.brand span{color:#c9a35e}.wrap{max-width:1250px;margin:30px auto;padding:0 20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tabbtn,.btn{border:0;border-radius:7px;padding:11px 16px;font-weight:bold;cursor:pointer}.tabbtn{background:white}.tabbtn.active,.btn{background:#c9a35e}.panel,.card{background:white;border:1px solid #e6e1d8;border-radius:12px;padding:22px;margin-bottom:20px}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8dce0;border-radius:7px;margin:6px 0 12px;font:inherit}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:12px;border-bottom:1px solid #eee;text-align:left}.muted{color:#718096}.secondary{background:#eef0f2}@media(max-width:700px){.row{grid-template-columns:1fr}.table{display:block;overflow:auto}}</style></head><body><div class="top"><div class="brand">Puvi <span>Law Office</span></div><button onclick="sb.auth.signOut().then(()=>location='login.html')">Logout</button></div><main class="wrap"><h1>Admin Dashboard</h1><div class="tabs"><button class="tabbtn active" onclick="show('cases',this)">Cases</button><button class="tabbtn" onclick="show('clients',this)">Clients</button><button class="tabbtn" onclick="show('hearings',this)">Hearings</button></div><section id="cases"><div class="panel"><button class="btn" onclick="newCase()">+ Add Case</button><input id="search" placeholder="Search cases..." oninput="renderCases()"><div id="caseForm" class="hidden"><h2 id="formTitle">Add Case</h2><input id="eid" type="hidden"><select id="client"></select><div class="row"><input id="number" placeholder="Case number"><input id="type" placeholder="Case type"></div><div class="row"><div>Filing date<input id="filing" type="date"></div><div>Next hearing date<input id="hearing" type="date"></div></div><div class="row"><select id="status"><option>Pending</option><option>Active</option><option>Hearing</option><option>Disposed</option><option>Closed</option></select><input id="opposite" placeholder="Opposite party"></div><textarea id="desc" rows="6" placeholder="Case description / full case details"></textarea><button class="btn" onclick="saveCase()">Save Case</button> <button class="tabbtn" onclick="caseForm.classList.add('hidden')">Cancel</button></div></div><div class="panel"><table class="table"><thead><tr><th>Case</th><th>Client</th><th>Next Hearing</th><th>Status</th><th>Action</th></tr></thead><tbody id="caseList"></tbody></table></div></section><section id="clients" class="hidden"><div class="panel"><h2>Clients</h2><div id="clientList"></div></div></section><section id="hearings" class="hidden"><div class="panel"><h2>Upcoming Hearings</h2><div id="hearingList"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://yrmrdqtynbitbbeajnoe.supabase.co','sb_publishable_aP4WOrkGeeUJRyfUs1nLiA_JUZcu_RC');let cases=[],clients=[];const $=x=>document.getElementById(x);function show(id,b){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tabbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active')}async function init(){let{data:{user}}=await sb.auth.getUser();if(!user)return location='login.html';let p=await sb.from('profiles').select('role').eq('id',user.id).single();if(p.data?.role!=='admin')return location='login.html';load()}async function load(){let p=await sb.from('profiles').select('id,full_name,phone,role').order('full_name');clients=(p.data||[]).filter(x=>x.role==='client');let c=await sb.from('cases').select('*').order('created_at',{ascending:false});cases=c.data||[];$('client').innerHTML='<option value="">Select client</option>'+clients.map(x=>`<option value="${x.id}">${x.full_name}</option>`).join('');$('clientList').innerHTML=clients.map(x=>`<div class="card"><b>${x.full_name}</b><div class="muted">${x.phone||''}</div></div>`).join('')||'No clients';renderCases();$('hearingList').innerHTML=cases.filter(x=>x.next_hearing_date).sort((a,b)=>a.next_hearing_date.localeCompare(b.next_hearing_date)).map(x=>`<div class="card"><b>${x.next_hearing_date}</b> — ${x.case_number}</div>`).join('')||'No hearings'}function renderCases(){let q=$('search').value.toLowerCase();let a=cases.filter(x=>(x.case_number+' '+x.status+' '+(clients.find(y=>y.id===x.client_id)?.full_name||'')).toLowerCase().includes(q));$('caseList').innerHTML=a.map(x=>`<tr><td><b>${x.case_number}</b><br>${x.case_type||''}</td><td>${clients.find(y=>y.id===x.client_id)?.full_name||''}</td><td>${x.next_hearing_date||'—'}</td><td>${x.status}</td><td><button class="btn secondary" onclick="editCase(${x.id})">View / Edit</button></td></tr>`).join('')}function newCase(){$('eid').value='';$('number').value='';$('type').value='';$('filing').value='';$('hearing').value='';$('status').value='Pending';$('opposite').value='';$('desc').value='';$('client').value='';$('formTitle').textContent='Add Case';$('caseForm').classList.remove('hidden')}function editCase(id){let x=cases.find(z=>z.id===id);$('eid').value=x.id;$('client').value=x.client_id;$('number').value=x.case_number||'';$('type').value=x.case_type||'';$('filing').value=x.filing_date||'';$('hearing').value=x.next_hearing_date||'';$('status').value=x.status||'Pending';$('opposite').value=x.opposite_party||'';$('desc').value=x.description||'';$('formTitle').textContent='Edit Case — '+x.case_number;$('caseForm').classList.remove('hidden');window.scrollTo(0,0)}async function saveCase(){let v={client_id:$('client').value,case_number:$('number').value,case_type:$('type').value||null,filing_date:$('filing').value||null,next_hearing_date:$('hearing').value||null,status:$('status').value,opposite_party:$('opposite').value||null,description:$('desc').value||null};if(!v.client_id||!v.case_number)return alert('Client and case number are required');let id=$('eid').value,r=id?await sb.from('cases').update(v).eq('id',id):await sb.from('cases').insert(v);if(r.error)return alert(r.error.message);$('caseForm').classList.add('hidden');await load();alert(id?'Case updated successfully':'Case created successfully')}init()</script></body></html>
