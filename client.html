<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Dashboard | Puvi Law Office</title><style>body{margin:0;background:#f7f4ed;color:#24303b;font-family:Arial,"Noto Sans Tamil",sans-serif}.bar{background:#0b1726;color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font:700 25px Georgia}.brand img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:50%;padding:2px}.brand span{color:#c9a35e}.wrap{max-width:1050px;margin:30px auto;padding:0 20px}.card{background:#fff;padding:24px;border-radius:10px;box-shadow:0 8px 30px #10203310;margin-bottom:18px}.case{border:1px solid #e5e1d9;padding:20px;border-radius:8px;margin:14px 0}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}.meta div{background:#fafafa;padding:12px}.label{font-size:11px;text-transform:uppercase;color:#8b7449;letter-spacing:1px}.value{font-weight:700}.btn{background:#c9a35e;border:0;padding:10px 15px;border-radius:5px;font-weight:bold;cursor:pointer}.muted{color:#6b7580}.doc{padding:10px 0;border-bottom:1px solid #eee}@media(max-width:650px){.meta{grid-template-columns:1fr}.bar{padding:10px 14px}.brand{font-size:20px}.brand img{width:42px;height:42px}}</style></head><body><header class="bar"><div class="brand"><img src="assets/puvi-law-logo.svg" alt="Puvi Law Office logo"><span>Puvi</span> Law Office</div><div><span id="user"></span> <button class="btn" onclick="logout()">Logout</button></div></header><main class="wrap"><h1>My Cases</h1><p class="muted">Your case information, hearing details and documents.</p><div id="content">Loading...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://yrmrdqtynbitbbeajnoe.supabase.co','sb_publishable_aP4WOrkGeeUJRyfUs1nLiA_JUZcu_RC');async function init(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='login.html';return}const {data:p}=await sb.from('profiles').select('full_name,role').eq('id',user.id).single();if(!p||p.role!=='client'){location.href='admin.html';return}document.getElementById('user').textContent=p.full_name;const {data:cases,error}=await sb.from('cases').select('id,case_number,case_type,court,filing_date,next_hearing_date,status,opposite_party,description').order('next_hearing_date',{ascending:true});if(error){document.getElementById('content').textContent=error.message;return}if(!cases.length){document.getElementById('content').innerHTML='<section class="card"><h2>No cases assigned yet</h2><p class="muted">Your case information will appear here once the office adds it to your account.</p></section>';return}document.getElementById('content').innerHTML=cases.map(c=>`<section class="card"><div class="case"><h2>${esc(c.case_number)}</h2><div class="meta"><div><div class="label">Case Type</div><div class="value">${esc(c.case_type||'—')}</div></div><div><div class="label">Court</div><div class="value">${esc(c.court||'—')}</div></div><div><div class="label">Status</div><div class="value">${esc(c.status||'—')}</div></div><div><div class="label">Next Hearing</div><div class="value">${esc(c.next_hearing_date||'—')}</div></div><div><div class="label">Filing Date</div><div class="value">${esc(c.filing_date||'—')}</div></div><div><div class="label">Opposite Party</div><div class="value">${esc(c.opposite_party||'—')}</div></div></div><h3>Case Details</h3><p>${esc(c.description||'No details added yet.')}</p><div id="notes-${c.id}">Loading notes...</div><div id="hearings-${c.id}">Loading hearings...</div><div id="documents-${c.id}">Loading documents...</div></div></section>`).join('');for(const c of cases){loadNotes(c.id);loadHearings(c.id);loadDocuments(c.id)}}async function loadNotes(id){const {data}=await sb.from('case_notes').select('note,created_at').eq('case_id',id).eq('visible_to_client',true).order('created_at',{ascending:false});const el=document.getElementById('notes-'+id);el.innerHTML='<h3>Updates</h3>'+(data&&data.length?data.map(n=>`<p><b>${new Date(n.created_at).toLocaleDateString()}</b> — ${esc(n.note)}</p>`).join(''):'<p class="muted">No client-visible updates.</p>')}async function loadHearings(id){const {data}=await sb.from('hearings').select('hearing_date,purpose,status,notes').eq('case_id',id).order('hearing_date',{ascending:false});const el=document.getElementById('hearings-'+id);el.innerHTML='<h3>Hearings</h3>'+(data&&data.length?data.map(h=>`<p><b>${esc(h.hearing_date)}</b> — ${esc(h.purpose||'')} — ${esc(h.status||'')} ${h.notes?'— '+esc(h.notes):''}</p>`).join(''):'<p class="muted">No hearing entries yet.</p>')}async function loadDocuments(id){const {data,error}=await sb.from('documents').select('id,file_name,file_path,created_at').eq('case_id',id).order('created_at',{ascending:false});const el=document.getElementById('documents-'+id);if(error){el.innerHTML='<h3>Documents</h3><p class="muted">Unable to load documents.</p>';return}el.innerHTML='<h3>Documents</h3>'+(data&&data.length?data.map(d=>`<div class="doc"><b>${esc(d.file_name)}</b><br><span class="muted">${new Date(d.created_at).toLocaleDateString()}</span><br><button class="btn" onclick="openDoc('${esc(d.id)}')">Open document</button></div>`).join(''):'<p class="muted">No documents available.</p>')}async function openDoc(id){const {data:d,error}=await sb.from('documents').select('file_path').eq('id',id).single();if(error)return alert('Unable to open document.');const {data,error:e}=await sb.storage.from('case-documents').createSignedUrl(d.file_path,300);if(e)return alert('Unable to open document.');window.open(data.signedUrl,'_blank','noopener')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function logout(){sb.auth.signOut().then(()=>location.href='login.html')}init();</script></body></html>
